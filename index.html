  let stars = [];

  function resizeCanvas() {
    spaceCanvas.width = window.innerWidth;
    spaceCanvas.height = window.innerHeight;
    createStars();
  }

  function createStars() {
    stars = [];
    const starCount = Math.floor((spaceCanvas.width * spaceCanvas.height) / 2600);

    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * spaceCanvas.width,
        y: Math.random() * spaceCanvas.height,
        z: Math.random() * spaceCanvas.width,
        size: Math.random() * 2 + 0.5
      });
    }
  }

  function drawHyperspeedStars() {
    ctx.fillStyle = "#000008";
    ctx.fillRect(0, 0, spaceCanvas.width, spaceCanvas.height);

    const centerX = spaceCanvas.width / 2;
    const centerY = spaceCanvas.height / 2;

    for (let i = 0; i < stars.length; i++) {
      const star = stars[i];

      star.z -= 14;

      if (star.z <= 1) {
        star.x = Math.random() * spaceCanvas.width;
        star.y = Math.random() * spaceCanvas.height;
        star.z = spaceCanvas.width;
        star.size = Math.random() * 2 + 0.5;
      }

      const sx = centerX + (star.x - centerX) / star.z * spaceCanvas.width;
      const sy = centerY + (star.y - centerY) / star.z * spaceCanvas.height;

      const scale = 1 - star.z / spaceCanvas.width;
      const size = Math.max(0.4, star.size * scale * 3);

      if (sx < -100 || sx > spaceCanvas.width + 100 || sy < -100 || sy > spaceCanvas.height + 100) {
        continue;
      }

      ctx.beginPath();
      ctx.arc(sx, sy, size, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = "rgba(120, 180, 255, 0.16)";
      ctx.lineWidth = Math.max(0.5, size / 3);
      ctx.stroke();
    }

    starAnimationFrame = requestAnimationFrame(drawHyperspeedStars);
  }

  function playPopSound() {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(900, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(120, audioContext.currentTime + 0.18);

      gainNode.gain.setValueAtTime(0.28, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.22);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.24);

      setTimeout(function () {
        audioContext.close();
      }, 500);
    } catch (error) {
      console.log("Audio pop sound could not play.");
    }
  }

  function createFireworkEmoji(startX, startY) {
    const emoji = fireworksEmojis[Math.floor(Math.random() * fireworksEmojis.length)];
    const particleCount = 16;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement("div");
      particle.className = "fireworkEmoji";
      particle.textContent = emoji;

      const angle = (Math.PI * 2 * i) / particleCount;
      const distance = 90 + Math.random() * 130;

      const endX = Math.cos(angle) * distance;
      const endY = Math.sin(angle) * distance;

      particle.style.left = startX + "px";
      particle.style.top = startY + "px";
      particle.style.opacity = "1";

      emojiLayer.appendChild(particle);

      const animation = particle.animate(
        [
          {
            transform: "translate(0px, 0px) scale(1.2) rotate(0deg)",
            opacity: 1
          },
          {
            transform: "translate(" + endX + "px, " + endY + "px) scale(0.3) rotate(" + (Math.random() * 360) + "deg)",
            opacity: 0
          }
        ],
        {
          duration: 900 + Math.random() * 700,
          easing: "cubic-bezier(0.1, 0.7, 0.3, 1)"
        }
      );

      animation.onfinish = function () {
        particle.remove();
      };
    }
  }

  function spawnFlyingEmoji() {
    const emoji = document.createElement("div");
    emoji.className = "flyingEmoji";

    emoji.textContent = flyingEmojis[Math.floor(Math.random() * flyingEmojis.length)];

    const startX = Math.random() * window.innerWidth;
    const startY = window.innerHeight + 80;

    const endX = startX + (Math.random() * 300 - 150);
    const endY = -140 - Math.random() * 180;

    emoji.style.left = startX + "px";
    emoji.style.top = startY + "px";

    emojiLayer.appendChild(emoji);

    const animation = emoji.animate(
      [
        {
          transform: "translate(0px, 0px) rotate(0deg) scale(1)",
          opacity: 1
        },
        {
          transform: "translate(" + (endX - startX) + "px, " + (endY - startY) + "px) rotate(" + (Math.random() * 720 - 360) + "deg) scale(1.15)",
          opacity: 1
        }
      ],
      {
        duration: 4200 + Math.random() * 4200,
        easing: "linear"
      }
    );

    const explodeTimer = setTimeout(function () {
      createFireworkEmoji(startX, startY);
      playPopSound();
      emoji.remove();
    }, 2600 + Math.random() * 2600);

    animation.onfinish = function () {
      clearTimeout(explodeTimer);
      emoji.remove();
    };
  }

  function startEmojiFireworks() {
    fireworkSpawner = setInterval(function () {
      const spawnCount = 2 + Math.floor(Math.random() * 3);

      for (let i = 0; i < spawnCount; i++) {
        spawnFlyingEmoji();
      }
    }, 520);
  }

  function buildCrawlText() {
    crawlTextElement.innerHTML = "";

    for (let i = 0; i < storyParagraphs.length; i++) {
      const paragraph = document.createElement("p");
      paragraph.textContent = storyParagraphs[i];
      crawlTextElement.appendChild(paragraph);
    }
  }

  function speakStory() {
    if (!("speechSynthesis" in window)) {
      return;
    }

    window.speechSynthesis.cancel();

    speechQueue = [];
    speechIndex = 0;

    speechQueue.push("There lived a galaxy far, far away.");

    for (let i = 0; i < storyParagraphs.length; i++) {
      speechQueue.push(storyParagraphs[i]);
    }

    speakNextLine();
  }

  function speakNextLine() {
    if (speechIndex >= speechQueue.length) {
      return;
    }

    const utterance = new SpeechSynthesisUtterance(speechQueue[speechIndex]);
    utterance.rate = 0.95;
    utterance.pitch = 0.9;
    utterance.volume = 1;

    utterance.onend = function () {
      speechIndex++;
      speakNextLine();
    };

    window.speechSynthesis.speak(utterance);
  }

  function startMusic() {
    musicFrame.src =
      "https://www.youtube.com/embed/ROSqOb0TVx8?autoplay=1&mute=0&controls=0&loop=1&playlist=ROSqOb0TVx8&modestbranding=1&rel=0&playsinline=1";
  }

  function resetExperience() {
    animationRunning = false;

    if (starAnimationFrame) {
      cancelAnimationFrame(starAnimationFrame);
      starAnimationFrame = null;
    }

    if (emojiAnimationFrame) {
      cancelAnimationFrame(emojiAnimationFrame);
      emojiAnimationFrame = null;
    }

    if (fireworkSpawner) {
      clearInterval(fireworkSpawner);
      fireworkSpawner = null;
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }

    emojiLayer.innerHTML = "";
    crawlTextElement.innerHTML = "";
    musicFrame.src = "";

    openingLine.style.display = "none";
    gameTitle.style.display = "none";
    crawlStage.style.display = "none";
    nearEndNotice.style.display = "none";
    replayButton.style.display = "none";

    createStars();
  }

  function startExperience() {
    resetExperience();

    animationRunning = true;

    introOverlay.style.display = "none";
    openingLine.style.display = "flex";

    drawHyperspeedStars();
    startEmojiFireworks();
    speakStory();

    setTimeout(function () {
      openingLine.style.display = "none";
      gameTitle.style.display = "flex";

      startMusic();

      setTimeout(function () {
        gameTitle.style.display = "none";
        crawlStage.style.display = "block";

        buildCrawlText();

        const crawlDuration = 150000;

        crawlBoxAnimate(crawlDuration);

        setTimeout(function () {
          nearEndNotice.style.display = "block";
        }, crawlDuration - 18000);

        setTimeout(function () {
          nearEndNotice.style.display = "none";
          replayButton.style.display = "block";
        }, crawlDuration);
      }, 3600);
    }, 4200);
  }

  function crawlBoxAnimate(duration) {
    const crawlBox = document.getElementById("crawlBox");

    crawlBox.animate(
      [
        {
          transform: "translateX(-50%) translateY(0px) rotateX(24deg)"
        },
        {
          transform: "translateX(-50%) translateY(-260vh) rotateX(24deg)"
        }
      ],
      {
        duration: duration,
        easing: "linear",
        fill: "forwards"
      }
    );
  }

  startButton.addEventListener("click", function () {
    startExperience();
  });

  replayButton.addEventListener("click", function () {
    startExperience();
  });

  window.addEventListener("resize", function () {
    resizeCanvas();
  });

  resizeCanvas();
</script>

</body>
</html>
